# Service identities from docs/SPEC.md §12.
# - aiops-telemetry: scrape-only, used by Prometheus and node-exporter.
# - aiops-observer: read-only object access, used by kube-state-metrics.
# - aiops-remediation-executor: created now, bound when the executor lands;
#   it must never be usable before that (no token, no bindings).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-telemetry
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-observer
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: observer
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-remediation-executor
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: remediation-executor
automountServiceAccountToken: false
