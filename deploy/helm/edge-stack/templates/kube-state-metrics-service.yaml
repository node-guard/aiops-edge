apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-stack.fullname" . }}-kube-state-metrics
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: {{ .Values.kubeStateMetrics.service.port }}
      targetPort: http-metrics
      protocol: TCP
    - name: telemetry
      port: {{ .Values.kubeStateMetrics.telemetryPort }}
      targetPort: telemetry
      protocol: TCP
  selector:
    {{- include "edge-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kube-state-metrics
