apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-stack.fullname" . }}-prometheus-config
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}
      evaluation_interval: {{ .Values.prometheus.evaluationInterval }}
      external_labels:
        site: {{ .Values.site.name | quote }}
        environment: {{ .Values.site.environment | quote }}

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:{{ .Values.prometheus.service.port }}

      # Node-level CPU, memory, disk and network from every node.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # Pod and workload object metadata (phase, restarts, requested resources).
      # This is not container CPU/memory; see the chart README for that gap.
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - {{ .Release.Namespace }}
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
            action: keep
            regex: kube-state-metrics
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http-metrics
          # Do not relabel namespace/service here: kube-state-metrics already
          # exports the real namespace/pod labels, and overwriting them with
          # the exporter's own namespace corrupts every kube_* query.

    {{- if .Values.alertmanager.enabled }}
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - {{ include "edge-stack.fullname" . }}-alertmanager:{{ .Values.alertmanager.service.port }}
    {{- end }}
