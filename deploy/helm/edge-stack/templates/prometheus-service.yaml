apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-stack.fullname" . }}-prometheus
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "edge-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
