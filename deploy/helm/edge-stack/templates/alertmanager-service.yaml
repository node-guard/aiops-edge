{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-stack.fullname" . }}-alertmanager
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.alertmanager.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "edge-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
{{- end }}
