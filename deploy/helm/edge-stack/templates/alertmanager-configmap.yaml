{{- if .Values.alertmanager.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-stack.fullname" . }}-alertmanager-config
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: alertmanager
data:
  alertmanager.yml: |
    # v0 has no receivers: alerts are accepted and grouped but not delivered.
    # Receivers and routing are added with the policy engine and notification
    # task; no credentials belong in this ConfigMap.
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ["alertname", "site", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: "null"
{{- end }}
