# Central control plane (MVP). Edge sites are deployed with Helm (deploy/helm/edge-stack).
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: aiops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 5s
      timeout: 3s
      retries: 10
    # not published to the host on purpose
  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.central
    command: ["uvicorn", "aiops.central.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.central
    command: ["python", "-m", "aiops.central.worker.main"]
    env_file: ../../.env
    depends_on:
      postgres:
        condition: service_healthy
  proxy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
volumes:
  pgdata:
