# Lab configuration. Override any value from the environment, e.g.
#   LAB_SERVER_DISK_GB=12 make lab-up
# Everything here is disposable and lives under deploy/lab/.state or images/.

LAB_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# Network: a dedicated NAT network. The existing `labnet` (10.10.10.0/24) is
# left untouched; it has no forwarding and no DHCP.
LAB_NETWORK_NAME="${LAB_NETWORK_NAME:-aiops-lab}"
LAB_BRIDGE="${LAB_BRIDGE:-virbr-aiops}"
LAB_NETWORK_CIDR="${LAB_NETWORK_CIDR:-192.168.100.0/24}"
LAB_NETWORK_PREFIX="${LAB_NETWORK_PREFIX:-24}"
LAB_GATEWAY="${LAB_GATEWAY:-192.168.100.1}"
LAB_DHCP_START="${LAB_DHCP_START:-192.168.100.100}"
LAB_DHCP_END="${LAB_DHCP_END:-192.168.100.199}"
LAB_SERVER_IP="${LAB_SERVER_IP:-192.168.100.10}"
LAB_WORKER_IP="${LAB_WORKER_IP:-192.168.100.11}"

# DNS handed to the guests. The libvirt DNS proxy on LAB_GATEWAY is blocked by
# some host firewalls, so default to the host's own upstream resolver instead.
LAB_DNS_SERVER="${LAB_DNS_SERVER:-}"
if [[ -z "$LAB_DNS_SERVER" || "$LAB_DNS_SERVER" == 127.* ]]; then
  LAB_DNS_SERVER="$(awk '/^nameserver[[:space:]]/ {print $2; exit}' /etc/resolv.conf 2>/dev/null || true)"
fi
if [[ -z "$LAB_DNS_SERVER" || "$LAB_DNS_SERVER" == 127.* ]]; then
  LAB_DNS_SERVER="$(awk '/^nameserver[[:space:]]/ {print $2; exit}' /run/systemd/resolve/resolv.conf 2>/dev/null || true)"
fi
[[ -n "$LAB_DNS_SERVER" ]] || LAB_DNS_SERVER="$LAB_GATEWAY"

# VMs. The README's 30-40 GB + 25 GB does not fit this host; these are the
# documented sparse-qcow2 defaults. Override when more disk is available.
LAB_SERVER_NAME="${LAB_SERVER_NAME:-aiops-edge-server}"
LAB_WORKER_NAME="${LAB_WORKER_NAME:-aiops-edge-worker}"
LAB_SERVER_VCPUS="${LAB_SERVER_VCPUS:-2}"
LAB_WORKER_VCPUS="${LAB_WORKER_VCPUS:-2}"
LAB_SERVER_MEM_MB="${LAB_SERVER_MEM_MB:-3072}"
LAB_WORKER_MEM_MB="${LAB_WORKER_MEM_MB:-2048}"
LAB_SERVER_DISK_GB="${LAB_SERVER_DISK_GB:-10}"
LAB_WORKER_DISK_GB="${LAB_WORKER_DISK_GB:-8}"
LAB_SERVER_MAC="${LAB_SERVER_MAC:-52:54:00:10:00:01}"
LAB_WORKER_MAC="${LAB_WORKER_MAC:-52:54:00:10:00:02}"

# Base image: Debian 12 genericcloud (cloud-init, small, BIOS bootable).
LAB_BASE_IMAGE_URL="${LAB_BASE_IMAGE_URL:-https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2}"
LAB_BASE_IMAGE_NAME="${LAB_BASE_IMAGE_NAME:-debian-12-genericcloud-amd64.qcow2}"

# K3s. Pin the version; override only deliberately.
K3S_VERSION="${K3S_VERSION:-v1.31.4+k3s1}"
K3S_SERVER_ARGS="${K3S_SERVER_ARGS:---disable traefik --write-kubeconfig-mode 600 --tls-san $LAB_SERVER_IP}"

# Paths. The repo lives on /home here, which has the most free space.
LAB_IMAGE_DIR="$LAB_DIR/images"
LAB_STATE_DIR="$LAB_DIR/.state"
LAB_CLOUD_INIT_DIR="$LAB_DIR/cloud-init"
LAB_TEMPLATE_DIR="$LAB_DIR/templates"
LAB_BASE_IMAGE="$LAB_IMAGE_DIR/$LAB_BASE_IMAGE_NAME"
LAB_SSH_PRIVATE_KEY="${LAB_SSH_PRIVATE_KEY:-$LAB_STATE_DIR/ssh/id_ed25519}"
LAB_SSH_PUBLIC_KEY="${LAB_SSH_PUBLIC_KEY:-$LAB_SSH_PRIVATE_KEY.pub}"
LAB_KUBECONFIG="$LAB_STATE_DIR/kubeconfig"
LAB_NAMESPACE="${LAB_NAMESPACE:-aiops-test}"
LAB_SSH_USER="${LAB_SSH_USER:-aiops}"
LAB_SSH_TIMEOUT="${LAB_SSH_TIMEOUT:-600}"
LAB_BOOT_TIMEOUT="${LAB_BOOT_TIMEOUT:-900}"

# QEMU runs as this user under qemu:///system. Arch uses libvirt-qemu; other
# distributions may use qemu. Override if /etc/libvirt/qemu.conf sets another.
LAB_QEMU_USER="${LAB_QEMU_USER:-libvirt-qemu}"

# Use the system qemu-img. PATH may resolve to an old Android SDK copy.
if [[ -x /usr/bin/qemu-img ]]; then
  QEMU_IMG="${QEMU_IMG:-/usr/bin/qemu-img}"
else
  QEMU_IMG="${QEMU_IMG:-qemu-img}"
fi
CLOUD_LOCALDS="${CLOUD_LOCALDS:-cloud-localds}"

LAB_SSH_OPTS=(
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null
  -o ConnectTimeout=5
  -o LogLevel=ERROR
)
