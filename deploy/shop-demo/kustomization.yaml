apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Everything in this bundle is disposable and belongs to the lab only.
namespace: aiops-test

resources:
  - configmap.yaml
  - secret.yaml
  - db-pvc.yaml
  - db-deployment.yaml
  - db-service.yaml
  - app-deployment.yaml
  - app-service.yaml

# scripts/build-and-load.sh pins the digest after every rebuild. A tag alone is
# not enough for a reproducible lab; `:latest` is never allowed here. The script
# replaces this line, so do not hand-edit it to a tag.
images:
  - name: shop-demo
    newName: shop-demo
    digest: sha256:d221e511e98eb283a14906fe5e2fb36544031b9efb3a5d8ac7398e63c450a222
