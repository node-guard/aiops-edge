# Gitleaks configuration.
#
# The contract examples must carry schema-valid UUIDs under `idempotency_key`
# (see contracts/schemas/command-envelope.v1.schema.json). The default
# generic-api-key heuristic flags the key name, not a credential, so allowlist
# only lines where an idempotency_key carries a UUID.
[extend]
useDefault = true

[allowlist]
description = "Schema-required idempotency_key UUIDs and the public shop-demo lab password are not secrets"
regexTarget = "line"
regexes = [
  '''"idempotency_key"\s*:\s*"[0-9a-fA-F-]{36}"''',
  # deploy/shop-demo/secret.yaml: base64("shop-demo-lab-only"). Example only;
  # the plaintext is in the file's comment and in the README.
  '''c2hvcC1kZW1vLWxhYi1vbmx5''',
]
