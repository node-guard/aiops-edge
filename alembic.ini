[alembic]
# %(here)s is the directory containing this file, so Alembic works from the
# repository root and from /app inside the image without changing directories.
script_location = %(here)s/src/aiops/central/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os

# No sqlalchemy.url here on purpose: the URL carries the PostgreSQL password.
# env.py resolves it from DATABASE_URL (or -x db_url=...).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
