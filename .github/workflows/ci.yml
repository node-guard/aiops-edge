name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      # Migration tests run against a real PostgreSQL; skipped when the URL is unset.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops
          POSTGRES_DB: aiops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIOPS_TEST_DATABASE_URL: postgresql+psycopg://aiops:aiops@localhost:5432/aiops_ci
    steps:
      # TODO(S11): pin third-party actions to full commit SHAs
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --dev
      - run: make check
