[project]
name = "aiops-edge"
version = "0.1.0"
description = "Agentic AIOps for Edge Environments (Master PFE)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
central = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "langgraph>=0.2",
]
edge = [
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "pyarrow>=16",
  "joblib>=1.4",
  "httpx>=0.27",
  "kubernetes>=30.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-PyYAML",
  "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["aiops.contracts.*", "aiops.common.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
